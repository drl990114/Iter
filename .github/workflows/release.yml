name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Version: auto uses the prepared version or Conventional Commits; stable promotes a prerelease'
        type: choice
        options: [auto, patch, minor, major, stable]
        default: auto
      dry_run:
        description: 'Prepare and test the candidate without publishing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iter-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      version: ${{ steps.prepare.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the versioned commit locally
        id: prepare
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.mjs prepare --mode "$RELEASE_MODE" --output "$RUNNER_TEMP/release-candidate"
      - name: Retain the exact candidate for testing and retries
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 7

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
      candidate_artifact_id: ${{ needs.prepare.outputs.artifact_id }}

  publish:
    needs: [prepare, checks]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-candidate
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Restore the tested commit
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: node scripts/release.mjs restore --candidate "$RUNNER_TEMP/release-candidate" --sha "$CANDIDATE_SHA"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish the tested version and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.mjs publish --candidate "$RUNNER_TEMP/release-candidate" --sha "$CANDIDATE_SHA"
